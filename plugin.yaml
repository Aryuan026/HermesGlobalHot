name: hermes-global-hot
version: 0.3.0
manifest_version: 2
api_version: 1
description: Request-only cross-mouth canonical near-field context for each supported Hermes provider request
author: Aryuan026
license: MIT
homepage: https://github.com/Aryuan026/HermesGlobalHot
tags: [context, cross-channel, hot-context, receipts]
requires_plugins:
  - id: hermes-continuity
    version_range: ">=0.4,<1"
provides_hooks:
  - post_api_request
  - api_request_error
config_schema:
  max_projection_chars:
    type: int
    default: 24000
    description: Hard character ceiling for one request-only Global Hot carrier
  max_cached_turns:
    type: int
    default: 128
    description: Process-private hard cap for frozen turn plans and live request attempts
  attempt_ttl_seconds:
    type: float
    default: 600.0
    description: Process-private request attempt lease before missing hooks revoke projection authority
